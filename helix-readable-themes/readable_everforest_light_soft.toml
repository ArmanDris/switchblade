# Everforest Light Soft for Helix.
# Scope map inherited from Helix's built-in Everforest theme; palette uses
# Everforest's official Soft background series.

inherits = "everforest_light"

"ui.cursor.primary" = { fg = "bg0", bg = "orange" }
"ui.cursor.primary.insert" = { fg = "bg0", bg = "green" }
"ui.cursor.primary.select" = { fg = "bg0", bg = "blue" }
"ui.selection" = { bg = "bg_visual" }
"ui.selection.primary" = { bg = "bg_red" }

[palette]
bg_dim = "#e5dfc5"
bg0 = "#f3ead3"
bg1 = "#eae4ca"
bg2 = "#e5dfc5"
bg3 = "#ddd8be"
bg4 = "#d8d3ba"
bg5 = "#b9c0ab"
bg_visual = "#e1e4bd"
bg_red = "#fadbd0"
bg_yellow = "#f1e4c5"
bg_green = "#e5e6c5"
bg_blue = "#e1e7dd"

fg = "#5c6a72"
red = "#f85552"
orange = "#f57d26"
yellow = "#dfa000"
green = "#8da101"
aqua = "#35a77c"
blue = "#3a94c5"
purple = "#df69ba"

grey0 = "#a6b0a0"
grey1 = "#939f91"
grey2 = "#829181"
statusline1 = "#93b259"
statusline2 = "#708089"
statusline3 = "#e66868"
