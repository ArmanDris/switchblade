# Everforest Dark Soft for Helix.
# Scope map inherited from Helix's built-in Everforest theme; palette uses
# Everforest's official Soft background series.

inherits = "everforest_dark"

"ui.cursor.primary" = { fg = "bg0", bg = "orange" }
"ui.cursor.primary.insert" = { fg = "bg0", bg = "green" }
"ui.cursor.primary.select" = { fg = "bg0", bg = "blue" }
"ui.selection" = { bg = "bg_visual" }
"ui.selection.primary" = { bg = "bg_red" }

[palette]
bg_dim = "#293136"
bg0 = "#333c43"
bg1 = "#3a464c"
bg2 = "#434f55"
bg3 = "#4d5960"
bg4 = "#555f66"
bg5 = "#5d6b66"
bg_visual = "#5c3f4f"
bg_red = "#59464c"
bg_yellow = "#55544a"
bg_green = "#48584e"
bg_blue = "#3f5865"

fg = "#d3c6aa"
red = "#e67e80"
orange = "#e69875"
yellow = "#dbbc7f"
green = "#a7c080"
aqua = "#83c092"
blue = "#7fbbb3"
purple = "#d699b6"

grey0 = "#7a8478"
grey1 = "#859289"
grey2 = "#9da9a0"
statusline1 = "#a7c080"
statusline2 = "#d3c6aa"
statusline3 = "#e67e80"
